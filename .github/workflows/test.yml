name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research pipeline
        run: python -m pip install .
      - name: Test research pipeline
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Install browser
        working-directory: site
        timeout-minutes: 10
        run: npx playwright install --only-shell chromium
      - name: Build and test site
        working-directory: site
        run: npm test
      - name: Rebuild the private identifier audit source
        run: |
          sudo apt-get install --yes poppler-utils ripgrep
          scripts/download-source.sh
          python -m oss_research ingest --pdf data/source/personnel-database.pdf
      - name: Audit public identifier redaction
        run: python scripts/audit_public_identifiers.py
